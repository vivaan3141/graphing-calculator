<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desmos-Inspired Dark Graphing Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/expr-eval@2.0.2/dist/bundle.min.js"></script>
    <style>
      :root {
        --bg: #0f1117;
        --bg-2: #171b22;
        --panel: #1b2028;
        --panel-2: #202732;
        --panel-3: #2a313d;
        --line: rgba(255,255,255,0.08);
        --line-strong: rgba(255,255,255,0.15);
        --text: #f1f5f9;
        --muted: #9aa6b2;
        --muted-2: #7d8a9a;
        --acc-1: #52d3b0;
        --acc-2: #5fa8ff;
        --acc-3: #ffb454;
        --acc-4: #fa7fb4;
        --danger: #ff7d7d;
        --toolbar: #121821;
        --shadow: rgba(0,0,0,0.35);
        --canvas-bg: #0d1117;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        display: flex;
        min-height: 100vh;
        overflow: hidden;
      }

      button, input {
        font: inherit;
      }

      .sidebar {
        width: 340px;
        min-width: 280px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(25,30,38,1), rgba(20,24,31,1));
        border-right: 1px solid rgba(255,255,255,0.08);
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 62px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(17,22,28,0.85);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand-icon {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(81,211,176,0.18), rgba(95,168,255,0.14));
        color: var(--acc-1);
        font-size: 1rem;
      }

      .reset-btn {
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .reset-btn:hover {
        background: rgba(255,255,255,0.05);
      }

      .expr-list {
        flex: 1;
        overflow-y: auto;
        padding: 14px 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .item {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 10px 8px;
      }

      .eq-row,
      .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .visibility-toggle {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.04);
        color: #fff;
        font-size: 11px;
        display: grid;
        place-items: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .visibility-toggle.on {
        background: rgba(82,211,176,0.9);
        border-color: rgba(82,211,176,1);
        color: #0a1220;
      }

      .label {
        color: var(--muted-2);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 700;
        min-width: 18px;
      }

      .equation-input {
        flex: 1;
        height: 32px;
        background: rgba(12,17,22,0.8);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 0 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        outline: none;
      }

      .equation-input:focus,
      .slider-name:focus {
        border-color: rgba(82,211,176,0.75);
        box-shadow: inset 0 0 0 1px rgba(82,211,176,0.35);
      }

      .item-delete {
        width: 20px;
        height: 20px;
        border: none;
        background: transparent;
        border-radius: 6px;
        color: var(--muted-2);
        cursor: pointer;
        font-size: 16px;
      }

      .item-delete:hover {
        color: var(--danger);
      }

      .slider-row {
        margin-bottom: 8px;
      }

      .slider-name {
        width: 52px;
        height: 30px;
        border-radius: 8px;
        background: rgba(12,17,22,0.8);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      .slider-value {
        flex: 1;
        text-align: right;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 700;
      }

      .range {
        width: 100%;
        accent-color: #f3b453;
        cursor: pointer;
      }

      .sidebar-actions {
        border-top: 1px solid var(--line);
        background: rgba(17,21,26,0.8);
        padding: 14px 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .primary-btn,
      .secondary-btn {
        border: none;
        border-radius: 10px;
        padding: 11px 12px;
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.15s ease;
      }

      .primary-btn:hover,
      .secondary-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .primary-btn {
        background: linear-gradient(135deg, #2bc08d, #1d9b72);
      }

      .secondary-btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(17,22,28,0.75);
      }

      .mode-switch {
        display: flex;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
        padding: 3px;
        gap: 4px;
      }

      .mode-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 9px;
        font-weight: 700;
        cursor: pointer;
      }

      .mode-btn.active {
        background: rgba(82,211,176,0.12);
        color: #d8fff4;
        box-shadow: inset 0 0 0 1px rgba(82,211,176,0.35);
      }

      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .zoom-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-size: 20px;
        cursor: pointer;
      }

      .surface-badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 18px 0;
        background: rgba(11,16,22,0.75);
      }

      .badge {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 600;
      }

      .canvas-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        background: linear-gradient(180deg, rgba(9,14,18,1), rgba(12,16,22,1));
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        background: var(--canvas-bg);
      }

      canvas.dragging {
        cursor: grabbing;
      }

      @media (max-width: 820px) {
        body { flex-direction: column; }
        .sidebar {
          width: 100%;
          min-width: 0;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
        .toolbar {
          flex-wrap: wrap;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">📈</div>
          <span>Graphing</span>
        </div>
        <button class="reset-btn" onclick="resetView()">Reset</button>
      </div>

      <div id="expressionList" class="expr-list"></div>

      <div class="sidebar-actions">
        <button class="primary-btn" onclick="addEquation()">＋ Add Equation</button>
        <button class="secondary-btn" onclick="addSlider()">🎚️ Add Slider</button>
        <button class="secondary-btn" onclick="addSurface()">🧊 Add 3D Surface</button>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="2d">2D</button>
          <button class="mode-btn" data-mode="3d">3D</button>
        </div>

        <div class="toolbar-right">
          <button class="zoom-btn" onclick="zoomView(0.8)">−</button>
          <button class="zoom-btn" onclick="zoomView(1.25)">＋</button>
        </div>
      </div>

      <div class="surface-badges" id="surfaceBadges" style="display:none;">
        <div class="badge">x range: <span id="xRangeVal">[-5, 5]</span></div>
        <div class="badge">y range: <span id="yRangeVal">[-5, 5]</span></div>
        <div class="badge">drag to rotate</div>
      </div>

      <div class="canvas-wrap">
        <canvas id="graphCanvas"></canvas>
      </div>
    </main>

    <script>
      const Parser = exprEval.Parser;
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');

      const palette = ['#52d3b0', '#5fa8ff', '#ffb454', '#fa7fb4', '#a084ff', '#ff7d7d'];

      let viewMode = '2d';
      let dragState = { active: false, x: 0, y: 0 };
      let items = [
        { id: createId('eq'), type: 'equation', value: 'x^2 - a', visible: true, color: '#52d3b0' },
        { id: createId('slider'), type: 'slider', variable: 'a', value: 2, min: -10, max: 10, step: 0.1 }
      ];

      const default2D = { xMin: -10, xMax: 10, yMin: -10, yMax: 10 };
      const default3D = { xMin: -5, xMax: 5, yMin: -5, yMax: 5, zMin: -5, zMax: 5, rotX: -0.85, rotY: 0.9, zoom: 1 };
      let view = { ...default2D };

      function createId(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function getNextColor() {
        const used = items.filter(i => i.type === 'equation').length;
        return palette[used % palette.length];
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderList() {
        const container = document.getElementById('expressionList');
        container.innerHTML = '';

        items.forEach((item) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'item';

          if (item.type === 'equation') {
            wrapper.innerHTML = `
              <div class="eq-row">
                <button class="visibility-toggle ${item.visible ? 'on' : ''}" onclick="toggleItem('${item.id}')">${item.visible ? '✓' : ''}</button>
                <span class="label">y =</span>
                <input class="equation-input" style="border-color: ${item.color};" value="${escapeHtml(item.value)}" oninput="updateEquation('${item.id}', this.value)" />
                <button class="item-delete" onclick="deleteItem('${item.id}')">×</button>
              </div>
            `;
          } else if (item.type === 'slider') {
            wrapper.innerHTML = `
              <div class="slider-row">
                <input class="slider-name" value="${escapeHtml(item.variable)}" maxlength="3" oninput="updateSliderVariable('${item.id}', this.value)" />
                <span class="label">=</span>
                <span class="slider-value">${Number(item.value).toFixed(2)}</span>
                <button class="item-delete" onclick="deleteItem('${item.id}')">×</button>
              </div>
              <input class="range" type="range" min="${item.min}" max="${item.max}" step="${item.step}" value="${item.value}" oninput="updateSliderValue('${item.id}', this.value)" />
            `;
          } else if (item.type === 'surface') {
            wrapper.innerHTML = `
              <div class="eq-row">
                <button class="visibility-toggle ${item.visible ? 'on' : ''}" onclick="toggleItem('${item.id}')">${item.visible ? '✓' : ''}</button>
                <span class="label">z =</span>
                <input class="equation-input" style="border-color: ${item.color};" value="${escapeHtml(item.value)}" oninput="updateEquation('${item.id}', this.value)" />
                <button class="item-delete" onclick="deleteItem('${item.id}')">×</button>
              </div>
            `;
          }

          container.appendChild(wrapper);
        });
      }

      function addEquation() {
        items.push({ id: createId('eq'), type: 'equation', value: 'sin(x)', visible: true, color: getNextColor() });
        renderList();
        draw();
      }

      function addSlider() {
        const taken = items.filter(i => i.type === 'slider').map(i => i.variable);
        const variable = ['a', 'b', 'c', 'k', 'm', 'n', 'p'].find(v => !taken.includes(v)) || 'a';
        items.push({ id: createId('slider'), type: 'slider', variable, value: 1, min: -10, max: 10, step: 0.1 });
        renderList();
        draw();
      }

      function addSurface() {
        items.push({ id: createId('surface'), type: 'surface', value: 'sin(x)*cos(y)', visible: true, color: '#a084ff' });
        renderList();
        draw();
      }

      function getScope() {
        const scope = {};
        items.forEach(item => {
          if (item.type === 'slider' && item.variable) {
            scope[item.variable] = item.value;
          }
        });
        return scope;
      }

      function updateEquation(id, value) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.value = value;
        draw();
      }

      function updateSliderVariable(id, value) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        const cleaned = value.replace(/[^a-zA-Z]/g, '').slice(0, 3) || 'a';
        item.variable = cleaned;
        renderList();
        draw();
      }

      function updateSliderValue(id, value) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.value = Number(value);
        renderList();
        draw();
      }

      function toggleItem(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.visible = !item.visible;
        renderList();
        draw();
      }

      function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        renderList();
        draw();
      }

      function resetView() {
        if (viewMode === '3d') {
          Object.assign(view, { ...default3D });
        } else {
          Object.assign(view, { ...default2D });
        }
        draw();
      }

      function setMode(mode) {
        viewMode = mode;
        if (mode === '3d') {
          Object.assign(view, { ...default3D });
        } else {
          Object.assign(view, { ...default2D });
        }
        document.querySelectorAll('.mode-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        const badges = document.getElementById('surfaceBadges');
        badges.style.display = mode === '3d' ? 'flex' : 'none';
        draw();
      }

      function toPixelX(x) {
        return ((x - view.xMin) / (view.xMax - view.xMin)) * canvas.width;
      }

      function toPixelY(y) {
        return canvas.height - ((y - view.yMin) / (view.yMax - view.yMin)) * canvas.height;
      }

      function toGraphX(px) {
        return view.xMin + (px / canvas.width) * (view.xMax - view.xMin);
      }

      function drawGrid() {
        const xRange = view.xMax - view.xMin;
        const rawStep = xRange / 10;
        const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
        const ratio = rawStep / magnitude;
        let step = magnitude;
        if (ratio > 5) step = 5 * magnitude;
        else if (ratio > 2) step = 2 * magnitude;

        const firstX = Math.ceil(view.xMin / step) * step;
        for (let gx = firstX; gx <= view.xMax + step * 0.5; gx += step) {
          const px = toPixelX(gx);
          const isAxis = Math.abs(gx) < step * 0.0001;
          ctx.strokeStyle = isAxis ? '#d7e2f2' : '#2a3340';
          ctx.lineWidth = isAxis ? 1.7 : 1;
          ctx.beginPath();
          ctx.moveTo(px, 0);
          ctx.lineTo(px, canvas.height);
          ctx.stroke();

          if (!isAxis) {
            ctx.fillStyle = '#8fa0b3';
            ctx.font = '10px ui-monospace';
            ctx.fillText(Number(gx.toFixed(2)), px + 4, toPixelY(0) + 12);
          }
        }

        const firstY = Math.ceil(view.yMin / step) * step;
        for (let gy = firstY; gy <= view.yMax + step * 0.5; gy += step) {
          const py = toPixelY(gy);
          const isAxis = Math.abs(gy) < step * 0.0001;
          ctx.strokeStyle = isAxis ? '#d7e2f2' : '#2a3340';
          ctx.lineWidth = isAxis ? 1.7 : 1;
          ctx.beginPath();
          ctx.moveTo(0, py);
          ctx.lineTo(canvas.width, py);
          ctx.stroke();

          if (!isAxis) {
            ctx.fillStyle = '#8fa0b3';
            ctx.font = '10px ui-monospace';
            ctx.fillText(Number(gy.toFixed(2)), toPixelX(0) + 6, py - 4);
          }
        }
      }

      function plot2D() {
        const scope = getScope();
        const equations = items.filter(i => i.type === 'equation' && i.visible && i.value.trim());

        equations.forEach(item => {
          try {
            const expr = Parser.parse(item.value);
            ctx.beginPath();
            ctx.strokeStyle = item.color;
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            let started = false;

            for (let px = 0; px <= canvas.width; px += 2) {
              const gx = toGraphX(px);
              scope.x = gx;
              const result = expr.evaluate(scope);

              if (typeof result === 'number' && Number.isFinite(result)) {
                const py = toPixelY(result);
                if (!started) {
                  ctx.moveTo(px, py);
                  started = true;
                } else {
                  ctx.lineTo(px, py);
                }
              } else {
                started = false;
              }
            }

            ctx.stroke();
          } catch (err) {
            // Ignore invalid expression while editing
          }
        });
      }

      function draw2DGraph() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        plot2D();
      }

      function rotatePoint(point, rx, ry) {
        const cx = Math.cos(ry), sx = Math.sin(ry);
        const cy = Math.cos(rx), sy = Math.sin(rx);

        const x1 = point.x * cx + point.z * sx;
        const z1 = -point.x * sx + point.z * cx;
        const y1 = point.y * cy - z1 * sy;
        const z2 = point.y * sy + z1 * cy;

        return { x: x1, y: y1, z: z2 };
      }

      function project3D(point) {
        const scale = 200 * view.zoom;
        const x = point.x * scale;
        const y = point.y * scale;
        const z = point.z * scale;
        const perspective = 1 / (1 + z / 900);
        const px = canvas.width / 2 + x * perspective;
        const py = canvas.height / 2 - y * perspective;
        return { x: px, y: py };
      }

      function draw3DGraph() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const xMin = view.xMin, xMax = view.xMax;
        const yMin = view.yMin, yMax = view.yMax;

        const gridStep = 0.8;

        ctx.strokeStyle = '#243040';
        ctx.lineWidth = 1;

        for (let x = xMin; x <= xMax + 0.01; x += gridStep) {
          ctx.beginPath();
          let first = true;
          for (let y = yMin; y <= yMax + 0.01; y += gridStep) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const q = project3D(p);
            if (first) { ctx.moveTo(q.x, q.y); first = false; } else { ctx.lineTo(q.x, q.y); }
          }
          ctx.stroke();
        }

        for (let y = yMin; y <= yMax + 0.01; y += gridStep) {
          ctx.beginPath();
          let first = true;
          for (let x = xMin; x <= xMax + 0.01; x += gridStep) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const q = project3D(p);
            if (first) { ctx.moveTo(q.x, q.y); first = false; } else { ctx.lineTo(q.x, q.y); }
          }
          ctx.stroke();
        }

        const surfaceItems = items.filter(i => i.type === 'surface' && i.visible && i.value.trim());
        surfaceItems.forEach(surface => {
          try {
            const expr = Parser.parse(surface.value);
            const scopeBase = getScope();
            const mesh = [];

            for (let gx = xMin; gx <= xMax + 0.0001; gx += 0.7) {
              const row = [];
              for (let gy = yMin; gy <= yMax + 0.0001; gy += 0.7) {
                const scope = { ...scopeBase, x: gx, y: gy };
                const zVal = expr.evaluate(scope);
                if (typeof zVal === 'number' && Number.isFinite(zVal)) {
                  const p = rotatePoint({ x: gx, y: gy, z: zVal }, view.rotX, view.rotY);
                  row.push(project3D(p));
                } else {
                  row.push(null);
                }
              }
              mesh.push(row);
            }

            ctx.strokeStyle = surface.color;
            ctx.lineWidth = 1.2;

            for (let i = 0; i < mesh.length - 1; i++) {
              for (let j = 0; j < mesh[i].length - 1; j++) {
                const a = mesh[i][j];
                const b = mesh[i][j + 1];
                const c = mesh[i + 1][j];
                const d = mesh[i + 1][j + 1];

                const segments = [[a, b], [a, c], [b, d], [c, d]];
                segments.forEach(([p1, p2]) => {
                  if (p1 && p2) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                  }
                });
              }
            }
          } catch (err) {
            // Ignore invalid expression while editing
          }
        });

        const axis = [
          { x: 0, y: 0, z: 0 },
          { x: 1, y: 0, z: 0 },
          { x: 0, y: 1, z: 0 },
          { x: 0, y: 0, z: 1 }
        ].map(p => project3D(rotatePoint(p, view.rotX, view.rotY)));

        ctx.strokeStyle = '#aab8c9';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(axis[0].x, axis[0].y);
        ctx.lineTo(axis[1].x, axis[1].y);
        ctx.moveTo(axis[0].x, axis[0].y);
        ctx.lineTo(axis[2].x, axis[2].y);
        ctx.moveTo(axis[0].x, axis[0].y);
        ctx.lineTo(axis[3].x, axis[3].y);
        ctx.stroke();

        document.getElementById('xRangeVal').textContent = `[${view.xMin.toFixed(1)}, ${view.xMax.toFixed(1)}]`;
        document.getElementById('yRangeVal').textContent = `[${view.yMin.toFixed(1)}, ${view.yMax.toFixed(1)}]`;
      }

      function draw() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width && rect.height) {
          canvas.width = rect.width;
          canvas.height = rect.height;
        }

        if (viewMode === '3d') {
          draw3DGraph();
        } else {
          draw2DGraph();
        }
      }

      function zoomView(factor) {
        if (viewMode === '3d') {
          view.zoom *= factor;
          draw();
          return;
        }

        const cx = (view.xMin + view.xMax) / 2;
        const cy = (view.yMin + view.yMax) / 2;
        const xRange = (view.xMax - view.xMin) * factor;
        const yRange = (view.yMax - view.yMin) * factor;
        view.xMin = cx - xRange / 2;
        view.xMax = cx + xRange / 2;
        view.yMin = cy - yRange / 2;
        view.yMax = cy + yRange / 2;
        draw();
      }

      canvas.addEventListener('mousedown', (e) => {
        dragState.active = true;
        dragState.x = e.clientX;
        dragState.y = e.clientY;
        canvas.classList.add('dragging');
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragState.active) return;

        const dx = e.clientX - dragState.x;
        const dy = e.clientY - dragState.y;
        dragState.x = e.clientX;
        dragState.y = e.clientY;

        if (viewMode === '3d') {
          view.rotY += dx * 0.01;
          view.rotX += dy * 0.01;
        } else {
          const unitsPerPixelX = (view.xMax - view.xMin) / canvas.width;
          const unitsPerPixelY = (view.yMax - view.yMin) / canvas.height;
          view.xMin -= dx * unitsPerPixelX;
          view.xMax -= dx * unitsPerPixelX;
          view.yMin += dy * unitsPerPixelY;
          view.yMax += dy * unitsPerPixelY;
        }

        draw();
      });

      window.addEventListener('mouseup', () => {
        dragState.active = false;
        canvas.classList.remove('dragging');
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 1.12 : 0.9;
        zoomView(factor);
      }, { passive: false });

      document.querySelectorAll('.mode-btn').forEach(button => {
        button.addEventListener('click', () => setMode(button.dataset.mode));
      });

      function init() {
        renderList();
        setMode('2d');
        draw();
        window.addEventListener('resize', draw);
      }

      init();
    </script>
  </body>
</html>
