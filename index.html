<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desmos 3D Graphing Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/expr-eval@2.0.2/dist/bundle.min.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --bg-2: #121922;
        --panel: #151d27;
        --panel-2: #1a2330;
        --panel-3: #202b38;
        --line: rgba(255,255,255,0.08);
        --line-strong: rgba(255,255,255,0.14);
        --text: #edf5ff;
        --muted: #a5afbb;
        --muted-2: #7e8d9b;
        --accent: #4aa3ff;
        --accent-2: #68d9c3;
        --surface-1: #5ea5ff;
        --surface-2: #64d7c5;
        --surface-3: #ffb65c;
        --danger: #ff7a7a;
        --shadow: rgba(0,0,0,0.34);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        display: flex;
        min-height: 100vh;
        overflow: hidden;
      }

      button, input {
        font: inherit;
      }

      .app {
        display: flex;
        width: 100%;
        min-height: 100vh;
        background: linear-gradient(180deg, #0d1219 0%, #0a1015 100%);
      }

      .sidebar {
        width: 268px;
        min-width: 240px;
        background: linear-gradient(180deg, rgba(16,20,26,0.98), rgba(12,16,21,0.98));
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 9px;
        border-bottom: 1px solid var(--line);
        background: rgba(15,19,25,0.82);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .brand-badge {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(74,163,255,0.18), rgba(104,217,195,0.12));
        border: 1px solid rgba(255,255,255,0.06);
        color: #8bbcff;
        font-size: 10px;
        font-weight: 800;
      }

      .reset-btn {
        border: 1px solid rgba(255,255,255,0.09);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        border-radius: 7px;
        padding: 6px 9px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }

      .reset-btn:hover {
        background: rgba(255,255,255,0.04);
      }

      .expr-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 9px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .expr-item {
        background: rgba(255,255,255,0.013);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 11px;
        padding: 8px 8px 7px;
      }

      .expr-row {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .color-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
      }

      .expr-input {
        flex: 1;
        width: 100%;
        height: 30px;
        background: rgba(10,14,18,0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        color: var(--text);
        padding: 0 9px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        outline: none;
      }

      .expr-input:focus {
        border-color: rgba(74,163,255,0.75);
        box-shadow: inset 0 0 0 1px rgba(74,163,255,0.18);
      }

      .toggle {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.03);
        color: white;
        display: grid;
        place-items: center;
        font-size: 10px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .toggle.on {
        background: rgba(104,217,195,0.85);
        border-color: rgba(104,217,195,1);
        color: #071017;
      }

      .delete-btn {
        width: 16px;
        height: 16px;
        border: none;
        background: transparent;
        color: var(--muted-2);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
      }

      .delete-btn:hover {
        color: var(--danger);
      }

      .sidebar-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 9px 12px;
        border-top: 1px solid var(--line);
        background: rgba(14,18,23,0.82);
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
        border-radius: 9px;
        padding: 9px 10px;
        font-weight: 700;
        cursor: pointer;
        transition: filter 0.12s ease, transform 0.12s ease;
      }

      .primary-btn:hover,
      .secondary-btn:hover {
        filter: brightness(1.04);
        transform: translateY(-1px);
      }

      .primary-btn {
        border: none;
        background: linear-gradient(135deg, #5ea5ff, #7fc9ff);
        color: #081523;
      }

      .secondary-btn {
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.03);
        color: var(--text);
      }

      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #091017;
      }

      .toolbar {
        height: 58px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(15,19,25,0.8);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mode-switch {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
      }

      .mode-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .mode-btn.active {
        background: rgba(74,163,255,0.12);
        color: #edf5ff;
        box-shadow: inset 0 0 0 1px rgba(74,163,255,0.24);
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
      }

      .canvas-shell {
        position: relative;
        flex: 1;
        min-height: 0;
        background: radial-gradient(circle at center, rgba(17,22,28,0.7), rgba(9,13,17,1));
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #090d12;
        cursor: grab;
      }

      canvas.dragging {
        cursor: grabbing;
      }

      @media (max-width: 780px) {
        body {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          min-width: 0;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .toolbar {
          height: auto;
          flex-wrap: wrap;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-badge">3D</div>
            <span>Desmos</span>
          </div>
          <button class="reset-btn" type="button" onclick="resetView()">Reset</button>
        </div>

        <div id="expressionList" class="expr-list"></div>

        <div class="sidebar-actions">
          <button class="primary-btn" type="button" onclick="addExpression()">＋ Add expression</button>
          <button class="secondary-btn" type="button" onclick="addExample()">Example</button>
        </div>
      </aside>

      <main class="main">
        <div class="toolbar">
          <div class="mode-switch">
            <button class="mode-btn active" type="button">3D</button>
          </div>

          <div class="toolbar-actions">
            <button class="icon-btn" type="button" onclick="zoomView(1.16)">＋</button>
            <button class="icon-btn" type="button" onclick="zoomView(0.87)">−</button>
          </div>
        </div>

        <div class="canvas-shell">
          <canvas id="graphCanvas"></canvas>
        </div>
      </main>
    </div>

    <script>
      const Parser = exprEval.Parser;
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');

      const palette = ['#5ea5ff', '#64d7c5', '#ffb454', '#f67cc4', '#8c9aff', '#ff7c7c'];

      const defaultView = {
        xMin: -5,
        xMax: 5,
        yMin: -5,
        yMax: 5,
        zMin: -5,
        zMax: 5,
        rotX: -0.82,
        rotY: 0.9,
        zoom: 1
      };

      let view = { ...defaultView };
      let dragState = { active: false, x: 0, y: 0 };

      function createId(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
      }

      let items = [
        { id: createId('expr'), type: 'surface', value: 'sin(x)*cos(y)', visible: true, color: '#5ea5ff' }
      ];

      function normalizeExpression(raw) {
        if (raw == null) return '';
        let expr = String(raw).trim();
        if (!expr) return '';

        expr = expr
          .replace(/−/g, '-')
          .replace(/–/g, '-')
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/·/g, '*')
          .replace(/\s+/g, '');

        const eqIndex = expr.indexOf('=');
        if (eqIndex !== -1) {
          expr = expr.slice(eqIndex + 1).trim();
        }

        if (!expr) return '';

        expr = expr.replace(/^\(?\s*(?:f\s*\(\s*(?:x\s*,\s*y|x|y|z)\s*\)|[xyz])\s*\)?\s*$/i, '');
        return expr;
      }

      function nextColor() {
        const used = items.filter(i => i.type === 'surface').length;
        return palette[used % palette.length];
      }

      function hexToRgba(hex, alpha) {
        const value = hex.replace('#', '');
        const full = value.length === 3 ? value.split('').map(ch => ch + ch).join('') : value;
        const num = parseInt(full, 16);
        const r = (num >> 16) & 255;
        const g = (num >> 8) & 255;
        const b = num & 255;
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderList() {
        const container = document.getElementById('expressionList');
        container.innerHTML = '';

        items.forEach((item) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'expr-item';
          wrapper.innerHTML = `
            <div class="expr-row">
              <span class="color-dot" style="background:${item.color};"></span>
              <input class="expr-input" style="border-color:${item.color};" value="${escapeHtml(item.value)}" oninput="updateExpression('${item.id}', this.value)" />
              <button class="toggle ${item.visible ? 'on' : ''}" type="button" onclick="toggleItem('${item.id}')">${item.visible ? '✓' : ''}</button>
              <button class="delete-btn" type="button" onclick="deleteItem('${item.id}')">×</button>
            </div>
          `;
          container.appendChild(wrapper);
        });
      }

      function addExpression() {
        items.push({ id: createId('expr'), type: 'surface', value: 'x^2 + y^2', visible: true, color: nextColor() });
        renderList();
        draw();
      }

      function addExample() {
        items = [
          { id: createId('expr'), type: 'surface', value: 'sin(x)*cos(y)', visible: true, color: '#5ea5ff' },
          { id: createId('expr'), type: 'surface', value: 'sqrt(9 - x^2 - y^2)', visible: true, color: '#64d7c5' },
          { id: createId('expr'), type: 'surface', value: 'x^2 + y^2', visible: true, color: '#ffb454' }
        ];
        renderList();
        draw();
      }

      function updateExpression(id, value) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.value = value;
        draw();
      }

      function toggleItem(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.visible = !item.visible;
        renderList();
        draw();
      }

      function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        if (!items.length) {
          items.push({ id: createId('expr'), type: 'surface', value: 'sin(x) * cos(y)', visible: true, color: nextColor() });
        }
        renderList();
        draw();
      }

      function resetView() {
        Object.assign(view, { ...defaultView });
        draw();
      }

      function rotatePoint(point, rx, ry) {
        const cx = Math.cos(ry), sx = Math.sin(ry);
        const cy = Math.cos(rx), sy = Math.sin(rx);

        const x1 = point.x * cx + point.z * sx;
        const z1 = -point.x * sx + point.z * cx;
        const y1 = point.y * cy - z1 * sy;
        const z2 = point.y * sy + z1 * cy;

        return { x: x1, y: y1, z: z2 };
      }

      function project3D(point) {
        const scale = 180 * view.zoom;
        const x = point.x * scale;
        const y = point.y * scale;
        const z = point.z * scale;
        const perspective = 1 / (1 + z / 900);
        return {
          x: canvas.width / 2 + x * perspective,
          y: canvas.height / 2 - y * perspective
        };
      }

      function drawGrid() {
        const xMin = view.xMin, xMax = view.xMax;
        const yMin = view.yMin, yMax = view.yMax;
        const step = 1;

        ctx.strokeStyle = 'rgba(255,255,255,0.045)';
        ctx.lineWidth = 1;

        for (let x = xMin; x <= xMax + 0.0001; x += step) {
          ctx.beginPath();
          let started = false;
          for (let y = yMin; y <= yMax + 0.0001; y += step) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const q = project3D(p);
            if (!started) {
              ctx.moveTo(q.x, q.y);
              started = true;
            } else {
              ctx.lineTo(q.x, q.y);
            }
          }
          ctx.stroke();
        }

        for (let y = yMin; y <= yMax + 0.0001; y += step) {
          ctx.beginPath();
          let started = false;
          for (let x = xMin; x <= xMax + 0.0001; x += step) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const q = project3D(p);
            if (!started) {
              ctx.moveTo(q.x, q.y);
              started = true;
            } else {
              ctx.lineTo(q.x, q.y);
            }
          }
          ctx.stroke();
        }
      }

      function drawAxes() {
        const axisPairs = [
          [
            { x: view.xMin, y: 0, z: 0 },
            { x: view.xMax, y: 0, z: 0 }
          ],
          [
            { x: 0, y: view.yMin, z: 0 },
            { x: 0, y: view.yMax, z: 0 }
          ],
          [
            { x: 0, y: 0, z: view.zMin },
            { x: 0, y: 0, z: view.zMax }
          ]
        ];

        ctx.lineWidth = 1.8;
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';

        axisPairs.forEach(([a, b]) => {
          const pa = project3D(rotatePoint(a, view.rotX, view.rotY));
          const pb = project3D(rotatePoint(b, view.rotX, view.rotY));
          ctx.beginPath();
          ctx.moveTo(pa.x, pa.y);
          ctx.lineTo(pb.x, pb.y);
          ctx.stroke();
        });
      }

      function drawSurface(item) {
        const normalized = normalizeExpression(item.value);
        if (!normalized) return;

        try {
          const expr = Parser.parse(normalized);
          const xMin = view.xMin, xMax = view.xMax;
          const yMin = view.yMin, yMax = view.yMax;
          const step = 0.5;
          const mesh = [];

          for (let gx = xMin; gx <= xMax + 0.0001; gx += step) {
            const row = [];
            for (let gy = yMin; gy <= yMax + 0.0001; gy += step) {
              const zVal = expr.evaluate({ x: gx, y: gy });
              if (typeof zVal === 'number' && Number.isFinite(zVal)) {
                row.push(project3D(rotatePoint({ x: gx, y: gy, z: zVal }, view.rotX, view.rotY)));
              } else {
                row.push(null);
              }
            }
            mesh.push(row);
          }

          for (let i = 0; i < mesh.length - 1; i++) {
            for (let j = 0; j < mesh[i].length - 1; j++) {
              const a = mesh[i][j];
              const b = mesh[i][j + 1];
              const c = mesh[i + 1][j];
              const d = mesh[i + 1][j + 1];

              const quads = [[a, b, d, c]];
              quads.forEach(([p1, p2, p3, p4]) => {
                if (p1 && p2 && p3 && p4) {
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.lineTo(p3.x, p3.y);
                  ctx.lineTo(p4.x, p4.y);
                  ctx.closePath();
                  ctx.fillStyle = hexToRgba(item.color, 0.18);
                  ctx.fill();
                  ctx.strokeStyle = hexToRgba(item.color, 0.8);
                  ctx.lineWidth = 0.9;
                  ctx.stroke();
                }
              });
            }
          }
        } catch (err) {
          // invalid expression while editing
        }
      }

      function draw() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width && rect.height) {
          canvas.width = rect.width;
          canvas.height = rect.height;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawAxes();

        items.filter(i => i.visible && i.value.trim()).forEach(drawSurface);
      }

      function zoomView(factor) {
        view.zoom *= factor;
        draw();
      }

      canvas.addEventListener('mousedown', (event) => {
        dragState.active = true;
        dragState.x = event.clientX;
        dragState.y = event.clientY;
        canvas.classList.add('dragging');
      });

      window.addEventListener('mousemove', (event) => {
        if (!dragState.active) return;
        const dx = event.clientX - dragState.x;
        const dy = event.clientY - dragState.y;
        dragState.x = event.clientX;
        dragState.y = event.clientY;

        view.rotY += dx * 0.012;
        view.rotX += dy * 0.012;
        draw();
      });

      window.addEventListener('mouseup', () => {
        dragState.active = false;
        canvas.classList.remove('dragging');
      });

      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        const factor = event.deltaY > 0 ? 1.1 : 0.92;
        zoomView(factor);
      }, { passive: false });

      function init() {
        renderList();
        resetView();
        draw();
        window.addEventListener('resize', draw);
      }

      init();
    </script>
  </body>
</html>
