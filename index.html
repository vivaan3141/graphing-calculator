<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Graphing Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/expr-eval@2.0.2/dist/bundle.min.js"></script>
    <style>
      :root {
        --bg: #0e1117;
        --bg-2: #10161d;
        --panel: #151c24;
        --panel-2: #191f2a;
        --panel-3: #1f2833;
        --panel-4: #222b36;
        --line: rgba(255,255,255,0.09);
        --line-strong: rgba(255,255,255,0.14);
        --text: #edf4ff;
        --muted: #a4adba;
        --muted-2: #7d8a99;
        --accent: #5ea5ff;
        --accent-2: #6ad7c3;
        --success: #4cd8a5;
        --danger: #ff7a7a;
        --shadow: rgba(0,0,0,0.36);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        display: flex;
        min-height: 100vh;
        overflow: hidden;
      }

      button, input {
        font: inherit;
      }

      .app {
        display: flex;
        width: 100%;
        min-height: 100vh;
        background: linear-gradient(180deg, #0f141b 0%, #0b1016 100%);
      }

      .sidebar {
        width: 318px;
        min-width: 280px;
        background: linear-gradient(180deg, rgba(18,22,28,1), rgba(13,17,22,1));
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 62px;
        padding: 12px 14px 11px;
        border-bottom: 1px solid var(--line);
        background: rgba(16,20,25,0.7);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: linear-gradient(135deg, rgba(94,165,255,0.18), rgba(106,215,195,0.12));
        border: 1px solid rgba(255,255,255,0.06);
        color: #8ebeff;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 800;
      }

      .reset-btn {
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .reset-btn:hover {
        background: rgba(255,255,255,0.04);
      }

      .expr-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .expr-item {
        background: rgba(255,255,255,0.015);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 10px 10px 8px;
      }

      .expr-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toggle {
        width: 18px;
        height: 18px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.03);
        border-radius: 50%;
        color: white;
        display: grid;
        place-items: center;
        font-size: 11px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .toggle.on {
        background: rgba(76,216,165,0.9);
        border-color: rgba(76,216,165,1);
        color: #0a1017;
      }

      .expr-label {
        color: var(--muted-2);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, Monaco, monospace;
        font-size: 11px;
        font-weight: 700;
      }

      .expr-input {
        flex: 1;
        height: 32px;
        background: rgba(12,16,21,0.88);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        color: var(--text);
        padding: 0 10px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        outline: none;
      }

      .expr-input:focus {
        border-color: rgba(94,165,255,0.7);
        box-shadow: inset 0 0 0 1px rgba(94,165,255,0.18);
      }

      .delete-btn {
        border: none;
        background: transparent;
        color: var(--muted-2);
        font-size: 18px;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        cursor: pointer;
      }

      .delete-btn:hover {
        color: var(--danger);
      }

      .sidebar-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 12px 16px;
        border-top: 1px solid var(--line);
        background: rgba(16,20,25,0.9);
      }

      .primary-btn, .secondary-btn {
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        padding: 11px 12px;
        font-weight: 700;
        cursor: pointer;
        transition: filter 0.12s ease, transform 0.12s ease;
      }

      .primary-btn:hover, .secondary-btn:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      .primary-btn {
        background: linear-gradient(135deg, #5ea5ff, #82d5ff);
        color: #081521;
        border: none;
      }

      .secondary-btn {
        background: rgba(255,255,255,0.04);
        color: var(--text);
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #0b1016;
      }

      .toolbar {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 16px 8px;
        border-bottom: 1px solid var(--line);
        background: rgba(16,21,27,0.82);
      }

      .mode-switch {
        display: flex;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
        padding: 3px;
      }

      .mode-btn {
        background: transparent;
        border: none;
        padding: 8px 11px;
        border-radius: 9px;
        color: var(--muted);
        font-weight: 700;
        cursor: pointer;
      }

      .mode-btn.active {
        background: rgba(94,165,255,0.12);
        color: #e7f3ff;
        box-shadow: inset 0 0 0 1px rgba(94,165,255,0.28);
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
      }

      .canvas-shell {
        position: relative;
        flex: 1;
        min-height: 0;
        background: linear-gradient(180deg, #0b1015 0%, #0d1218 100%);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #090d12;
        cursor: grab;
      }

      canvas.dragging {
        cursor: grabbing;
      }

      @media (max-width: 860px) {
        body {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          min-width: 0;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .toolbar {
          height: auto;
          flex-wrap: wrap;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-mark">3D</div>
            <span>Graphing</span>
          </div>
          <button class="reset-btn" type="button" onclick="resetView()">Reset</button>
        </div>

        <div id="expressionList" class="expr-list"></div>

        <div class="sidebar-actions">
          <button class="primary-btn" type="button" onclick="addExpression()">＋ Add expression</button>
          <button class="secondary-btn" type="button" onclick="addExample()">✦ Example</button>
        </div>
      </aside>

      <main class="main">
        <div class="toolbar">
          <div class="mode-switch">
            <button class="mode-btn active" type="button">3D</button>
          </div>

          <div class="toolbar-actions">
            <button class="icon-btn" type="button" onclick="zoomView(1.15)">＋</button>
            <button class="icon-btn" type="button" onclick="zoomView(0.88)">−</button>
          </div>
        </div>

        <div class="canvas-shell">
          <canvas id="graphCanvas"></canvas>
        </div>
      </main>
    </div>

    <script>
      const Parser = exprEval.Parser;
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');

      const palette = ['#5ea5ff', '#64d7c5', '#ffb454', '#f67cc4', '#8c9aff', '#ff7c7c'];

      const defaultView = {
        xMin: -5,
        xMax: 5,
        yMin: -5,
        yMax: 5,
        zMin: -5,
        zMax: 5,
        rotX: -0.85,
        rotY: 0.9,
        zoom: 1
      };

      let view = { ...defaultView };
      let dragState = { active: false, x: 0, y: 0 };

      function createId(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
      }

      let items = [
        { id: createId('expr'), type: 'surface', value: 'sin(x)*cos(y)', visible: true, color: '#5ea5ff' }
      ];

      function nextColor() {
        const used = items.filter(i => i.type === 'surface').length;
        return palette[used % palette.length];
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderList() {
        const container = document.getElementById('expressionList');
        container.innerHTML = '';

        items.forEach((item) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'expr-item';
          wrapper.innerHTML = `
            <div class="expr-row">
              <button class="toggle ${item.visible ? 'on' : ''}" type="button" onclick="toggleItem('${item.id}')">${item.visible ? '✓' : ''}</button>
              <span class="expr-label">z =</span>
              <input class="expr-input" style="border-color: ${item.color};" value="${escapeHtml(item.value)}" oninput="updateExpression('${item.id}', this.value)" />
              <button class="delete-btn" type="button" onclick="deleteItem('${item.id}')">×</button>
            </div>
          `;
          container.appendChild(wrapper);
        });
      }

      function addExpression() {
        items.push({ id: createId('expr'), type: 'surface', value: 'sin(x) + cos(y)', visible: true, color: nextColor() });
        renderList();
        draw();
      }

      function addExample() {
        items = [
          { id: createId('expr'), type: 'surface', value: 'sin(x)*cos(y)', visible: true, color: '#5ea5ff' },
          { id: createId('expr'), type: 'surface', value: 'sqrt(9 - x^2 - y^2)', visible: true, color: '#64d7c5' }
        ];
        renderList();
        draw();
      }

      function updateExpression(id, value) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.value = value;
        draw();
      }

      function toggleItem(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.visible = !item.visible;
        renderList();
        draw();
      }

      function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        if (!items.length) {
          items.push({ id: createId('expr'), type: 'surface', value: 'sin(x)*cos(y)', visible: true, color: nextColor() });
        }
        renderList();
        draw();
      }

      function resetView() {
        Object.assign(view, { ...defaultView });
        draw();
      }

      function rotatePoint(point, rx, ry) {
        const cx = Math.cos(ry), sx = Math.sin(ry);
        const cy = Math.cos(rx), sy = Math.sin(rx);

        const x1 = point.x * cx + point.z * sx;
        const z1 = -point.x * sx + point.z * cx;
        const y1 = point.y * cy - z1 * sy;
        const z2 = point.y * sy + z1 * cy;

        return { x: x1, y: y1, z: z2 };
      }

      function project3D(point) {
        const scale = 180 * view.zoom;
        const x = point.x * scale;
        const y = point.y * scale;
        const z = point.z * scale;
        const perspective = 1 / (1 + z / 900);
        return {
          x: canvas.width / 2 + x * perspective,
          y: canvas.height / 2 - y * perspective
        };
      }

      function drawGrid() {
        const xMin = view.xMin, xMax = view.xMax;
        const yMin = view.yMin, yMax = view.yMax;
        const step = 1;

        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';

        for (let x = xMin; x <= xMax + 0.0001; x += step) {
          ctx.beginPath();
          let started = false;
          for (let y = yMin; y <= yMax + 0.0001; y += step) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const q = project3D(p);
            if (!started) {
              ctx.moveTo(q.x, q.y);
              started = true;
            } else {
              ctx.lineTo(q.x, q.y);
            }
          }
          ctx.stroke();
        }

        for (let y = yMin; y <= yMax + 0.0001; y += step) {
          ctx.beginPath();
          let started = false;
          for (let x = xMin; x <= xMax + 0.0001; x += step) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const q = project3D(p);
            if (!started) {
              ctx.moveTo(q.x, q.y);
              started = true;
            } else {
              ctx.lineTo(q.x, q.y);
            }
          }
          ctx.stroke();
        }
      }

      function drawAxes() {
        const axes = [
          { x: 0, y: 0, z: 0 },
          { x: 1, y: 0, z: 0 },
          { x: 0, y: 1, z: 0 },
          { x: 0, y: 0, z: 1 }
        ].map(p => project3D(rotatePoint(p, view.rotX, view.rotY)));

        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();

        ctx.moveTo(axes[0].x, axes[0].y);
        ctx.lineTo(axes[1].x, axes[1].y);
        ctx.moveTo(axes[0].x, axes[0].y);
        ctx.lineTo(axes[2].x, axes[2].y);
        ctx.moveTo(axes[0].x, axes[0].y);
        ctx.lineTo(axes[3].x, axes[3].y);

        ctx.stroke();
      }

      function drawSurface(item) {
        try {
          const expr = Parser.parse(item.value);
          const xMin = view.xMin, xMax = view.xMax;
          const yMin = view.yMin, yMax = view.yMax;
          const step = 0.55;
          const mesh = [];

          for (let gx = xMin; gx <= xMax + 0.0001; gx += step) {
            const row = [];
            for (let gy = yMin; gy <= yMax + 0.0001; gy += step) {
              const zVal = expr.evaluate({ x: gx, y: gy });
              if (typeof zVal === 'number' && Number.isFinite(zVal)) {
                row.push(project3D(rotatePoint({ x: gx, y: gy, z: zVal }, view.rotX, view.rotY)));
              } else {
                row.push(null);
              }
            }
            mesh.push(row);
          }

          ctx.strokeStyle = item.color;
          ctx.lineWidth = 1.1;

          for (let i = 0; i < mesh.length - 1; i++) {
            for (let j = 0; j < mesh[i].length - 1; j++) {
              const a = mesh[i][j];
              const b = mesh[i][j + 1];
              const c = mesh[i + 1][j];
              const d = mesh[i + 1][j + 1];

              const segments = [[a,b],[a,c],[b,d],[c,d]];
              segments.forEach(([p1, p2]) => {
                if (p1 && p2) {
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.stroke();
                }
              });
            }
          }
        } catch (err) {
          // Ignore invalid input while editing.
        }
      }

      function draw() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width && rect.height) {
          canvas.width = rect.width;
          canvas.height = rect.height;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawAxes();

        items.filter(i => i.visible && i.value.trim()).forEach(drawSurface);
      }

      function zoomView(factor) {
        view.zoom *= factor;
        draw();
      }

      canvas.addEventListener('mousedown', (event) => {
        dragState.active = true;
        dragState.x = event.clientX;
        dragState.y = event.clientY;
        canvas.classList.add('dragging');
      });

      window.addEventListener('mousemove', (event) => {
        if (!dragState.active) return;

        const dx = event.clientX - dragState.x;
        const dy = event.clientY - dragState.y;
        dragState.x = event.clientX;
        dragState.y = event.clientY;

        view.rotY += dx * 0.01;
        view.rotX += dy * 0.01;
        draw();
      });

      window.addEventListener('mouseup', () => {
        dragState.active = false;
        canvas.classList.remove('dragging');
      });

      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        const factor = event.deltaY > 0 ? 1.08 : 0.93;
        zoomView(factor);
      }, { passive: false });

      function init() {
        renderList();
        resetView();
        draw();
        window.addEventListener('resize', draw);
      }

      init();
    </script>
  </body>
</html>
