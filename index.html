<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartGrapher</title>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2.0.2/dist/bundle.min.js"></script>
  <style>
    :root {
      --bg: #020817;
      --panel: #0f172a;
      --panel-alt: #111827;
      --panel-soft: #1e293b;
      --panel-strong: #334155;
      --line: #475569;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-2: #3b82f6;
      --accent-3: #f59e0b;
      --danger: #f87171;
      --shadow: rgba(15, 23, 42, 0.7);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      display: flex;
      overflow: hidden;
      user-select: none;
    }

    aside {
      width: 360px;
      min-width: 300px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.94));
      border-right: 1px solid rgba(148, 163, 184, 0.2);
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-shadow: 12px 0 30px var(--shadow);
      z-index: 2;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.85);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: #34d399;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      font-size: 1.3rem;
    }

    .reset-button,
    .action-button,
    .mode-button,
    .zoom-button,
    .mini-button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }

    .reset-button:hover,
    .action-button:hover,
    .mode-button:hover,
    .zoom-button:hover,
    .mini-button:hover { transform: translateY(-1px); }

    .reset-button {
      background: rgba(71, 85, 105, 0.75);
      color: #e2e8f0;
      padding: 7px 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .expression-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-section {
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 12px;
    }

    .item-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .equation-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-button {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(148, 163, 184, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: white;
      background: rgba(15, 23, 42, 0.8);
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-button.visible {
      background: #10b981;
      border-color: transparent;
    }

    .equation-label {
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      min-width: 18px;
    }

    .equation-input,
    .slider-name,
    .surface-input {
      flex: 1;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.45);
      color: var(--text);
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      outline: none;
    }

    .equation-input:focus,
    .slider-name:focus,
    .surface-input:focus {
      border-color: rgba(52, 211, 153, 0.85);
      box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.35);
    }

    .mini-button {
      background: transparent;
      color: rgba(148, 163, 184, 0.9);
      font-size: 1rem;
      font-weight: 700;
      padding: 0 4px;
    }

    .mini-button:hover { color: #fca5a5; }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .slider-name {
      width: 52px;
      flex: 0 0 52px;
      text-align: center;
    }

    .slider-value {
      flex: 1;
      font-size: 0.82rem;
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      text-align: right;
      min-width: 40px;
    }

    .range {
      width: 100%;
      accent-color: #f59e0b;
      cursor: pointer;
    }

    .actions {
      padding: 14px 16px 16px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-button {
      width: 100%;
      padding: 12px 10px;
      font-weight: 700;
      color: white;
      font-size: 0.92rem;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.12);
    }

    .action-button.primary {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .action-button.secondary {
      background: rgba(51, 65, 85, 0.9);
      color: #e2e8f0;
      box-shadow: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .graph-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 10px;
      gap: 10px;
      background: rgba(2, 6, 23, 0.78);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      z-index: 1;
    }

    .mode-switch {
      display: flex;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 3px;
      gap: 6px;
    }

    .mode-button {
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .mode-button.active {
      background: rgba(16, 185, 129, 0.15);
      color: #d1fae5;
      box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.4);
    }

    .viewport-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .zoom-button {
      width: 38px;
      height: 38px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #f8fafc;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .viewport-box {
      position: relative;
      flex: 1;
      min-height: 0;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.96), rgba(2, 6, 23, 1));
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      background: transparent;
    }

    canvas.dragging {
      cursor: grabbing;
    }

    .surface-controls {
      display: flex;
      gap: 8px;
      padding: 12px 18px 0;
      background: rgba(2, 6, 23, 0.7);
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 999px;
      padding: 7px 10px;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      body { flex-direction: column; }
      aside {
        width: 100%;
        min-width: 0;
        height: auto;
        border-right: none;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      }
      .graph-header { flex-wrap: wrap; }
      .viewport-controls { margin-left: 0; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="toolbar">
      <div class="brand"><span class="brand-mark">📈</span> SmartGrapher</div>
      <button class="reset-button" onclick="resetView()">Reset View</button>
    </div>

    <div id="expressionList" class="expression-list"></div>

    <div class="actions">
      <button class="action-button primary" onclick="addEquationItem()">＋ Add 2D Equation</button>
      <button class="action-button secondary" onclick="addSliderItem()">🎚️ Add Variable Slider</button>
      <button class="action-button secondary" onclick="addSurfaceItem()">🧊 Add 3D Surface</button>
    </div>
  </aside>

  <main>
    <div class="graph-header">
      <div class="mode-switch">
        <button class="mode-button active" data-mode="2d">2D Graph</button>
        <button class="mode-button" data-mode="3d">3D Graph</button>
      </div>
      <div class="viewport-controls">
        <button class="zoom-button" onclick="zoomView(0.8)">−</button>
        <button class="zoom-button" onclick="zoomView(1.25)">＋</button>
      </div>
    </div>

    <div class="surface-controls" id="surfaceControls" style="display:none;">
      <div class="chip">X range: <span id="xRangeLabel">[-5, 5]</span></div>
      <div class="chip">Y range: <span id="yRangeLabel">[-5, 5]</span></div>
      <div class="chip">Rotate: drag to orbit</div>
    </div>

    <div class="viewport-box">
      <canvas id="graphCanvas"></canvas>
    </div>
  </main>

  <script>
    const Parser = exprEval.Parser;
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');

    const palette = ['#10b981', '#3b82f6', '#ec4899', '#f59e0b', '#8b5cf6', '#ef4444'];

    let viewMode = '2d';
    let dragState = { active: false, x: 0, y: 0 };
    let items = [
      { id: 'eq-1', type: 'equation', value: 'x^2 - a', color: '#10b981', visible: true },
      { id: 'slider-1', type: 'slider', variable: 'a', value: 2, min: -10, max: 10, step: 0.1 }
    ];

    const default2DView = { xMin: -10, xMax: 10, yMin: -10, yMax: 10 };
    const default3DView = { rotX: -0.8, rotY: 0.9, zoom: 1.0, xMin: -5, xMax: 5, yMin: -5, yMax: 5, zMin: -5, zMax: 5 };
    let view = { ...default2DView };

    function createId(prefix) {
      return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function getEquationColor() {
      const eqCount = items.filter(i => i.type === 'equation').length;
      return palette[eqCount % palette.length];
    }

    function renderExpressionList() {
      const container = document.getElementById('expressionList');
      container.innerHTML = '';

      items.forEach((item) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'panel-section';

        if (item.type === 'equation') {
          wrapper.innerHTML = `
            <div class="item-row">
              <div class="equation-row">
                <button class="toggle-button ${item.visible ? 'visible' : ''}" onclick="toggleVisibility('${item.id}')">${item.visible ? '✓' : ''}</button>
                <span class="equation-label">y =</span>
                <input class="equation-input" value="${escapeHtml(item.value)}" oninput="updateEquation('${item.id}', this.value)" style="border-color: ${item.color};" />
                <button class="mini-button" onclick="deleteItem('${item.id}')">✕</button>
              </div>
            </div>
          `;
        } else if (item.type === 'slider') {
          wrapper.innerHTML = `
            <div class="item-row">
              <div class="slider-row">
                <input class="slider-name" value="${escapeHtml(item.variable)}" maxlength="3" oninput="updateSliderVariable('${item.id}', this.value)" />
                <span class="equation-label">=</span>
                <span class="slider-value">${Number(item.value).toFixed(2)}</span>
                <button class="mini-button" onclick="deleteItem('${item.id}')">✕</button>
              </div>
              <input class="range" type="range" min="${item.min}" max="${item.max}" step="${item.step}" value="${item.value}" oninput="updateSliderValue('${item.id}', this.value)" />
            </div>
          `;
        } else if (item.type === 'surface') {
          wrapper.innerHTML = `
            <div class="item-row">
              <div class="equation-row">
                <button class="toggle-button ${item.visible ? 'visible' : ''}" onclick="toggleVisibility('${item.id}')">${item.visible ? '✓' : ''}</button>
                <span class="equation-label">z =</span>
                <input class="equation-input" value="${escapeHtml(item.value)}" oninput="updateEquation('${item.id}', this.value)" style="border-color: ${item.color};" />
                <button class="mini-button" onclick="deleteItem('${item.id}')">✕</button>
              </div>
            </div>
          `;
        }

        container.appendChild(wrapper);
      });
    }

    function addEquationItem() {
      const newItem = {
        id: createId('eq'),
        type: 'equation',
        value: 'sin(x)',
        color: getEquationColor(),
        visible: true
      };
      items.push(newItem);
      renderExpressionList();
      draw();
    }

    function addSurfaceItem() {
      const surface = {
        id: createId('surface'),
        type: 'surface',
        value: 'sin(x)*cos(y)',
        color: '#8b5cf6',
        visible: true
      };
      items.push(surface);
      renderExpressionList();
      draw();
    }

    function addSliderItem() {
      const taken = items.filter(i => i.type === 'slider').map(i => i.variable);
      const available = ['a', 'b', 'c', 'k', 'm', 'n', 'p'].find(v => !taken.includes(v)) || 'a';
      const slider = {
        id: createId('slider'),
        type: 'slider',
        variable: available,
        value: 1,
        min: -10,
        max: 10,
        step: 0.1
      };
      items.push(slider);
      renderExpressionList();
      draw();
    }

    function updateEquation(id, value) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.value = value;
        draw();
      }
    }

    function updateSliderVariable(id, value) {
      const item = items.find(i => i.id === id);
      if (item) {
        const sanitized = value.replace(/[^a-zA-Z]/g, '').slice(0, 3) || 'a';
        item.variable = sanitized;
        renderExpressionList();
        draw();
      }
    }

    function updateSliderValue(id, value) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.value = Number(value);
        renderExpressionList();
        draw();
      }
    }

    function toggleVisibility(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.visible = !item.visible;
        renderExpressionList();
        draw();
      }
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      renderExpressionList();
      draw();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getScope() {
      const scope = {};
      items.forEach(item => {
        if (item.type === 'slider' && item.variable) {
          scope[item.variable] = item.value;
        }
      });
      return scope;
    }

    function plot2DGraph() {
      const scope = getScope();
      const equations = items.filter(item => item.type === 'equation' && item.visible && item.value.trim());

      equations.forEach(item => {
        try {
          const expr = Parser.parse(item.value);
          ctx.beginPath();
          ctx.strokeStyle = item.color;
          ctx.lineWidth = 3;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';

          let started = false;

          for (let px = 0; px <= canvas.width; px += 2) {
            const gx = toGraphX(px);
            scope.x = gx;
            const gy = expr.evaluate(scope);

            if (typeof gy === 'number' && Number.isFinite(gy)) {
              const py = toPixelY(gy);
              if (!started) {
                ctx.moveTo(px, py);
                started = true;
              } else {
                ctx.lineTo(px, py);
              }
            } else {
              started = false;
            }
          }

          ctx.stroke();
        } catch (error) {
          // Ignore invalid expressions while user types
        }
      });
    }

    function toPixelX(graphX) {
      return ((graphX - view.xMin) / (view.xMax - view.xMin)) * canvas.width;
    }

    function toPixelY(graphY) {
      return canvas.height - (((graphY - view.yMin) / (view.yMax - view.yMin)) * canvas.height);
    }

    function toGraphX(pixelX) {
      return view.xMin + (pixelX / canvas.width) * (view.xMax - view.xMin);
    }

    function drawGrid() {
      const xRange = view.xMax - view.xMin;
      const rawStep = xRange / 10;
      const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
      const ratio = rawStep / magnitude;

      let step = magnitude;
      if (ratio > 5) step = 5 * magnitude;
      else if (ratio > 2) step = 2 * magnitude;

      const firstX = Math.ceil(view.xMin / step) * step;
      for (let gx = firstX; gx <= view.xMax + step * 0.5; gx += step) {
        const px = toPixelX(gx);
        const isAxis = Math.abs(gx) < step * 0.0001;
        ctx.strokeStyle = isAxis ? '#cbd5e1' : '#334155';
        ctx.lineWidth = isAxis ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(px, 0);
        ctx.lineTo(px, canvas.height);
        ctx.stroke();

        if (!isAxis) {
          ctx.fillStyle = '#64748b';
          ctx.font = '10px monospace';
          ctx.fillText(Number(gx.toFixed(3)), px + 4, toPixelY(0) + 12);
        }
      }

      const firstY = Math.ceil(view.yMin / step) * step;
      for (let gy = firstY; gy <= view.yMax + step * 0.5; gy += step) {
        const py = toPixelY(gy);
        const isAxis = Math.abs(gy) < step * 0.0001;
        ctx.strokeStyle = isAxis ? '#cbd5e1' : '#334155';
        ctx.lineWidth = isAxis ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
        ctx.stroke();

        if (!isAxis) {
          ctx.fillStyle = '#64748b';
          ctx.font = '10px monospace';
          ctx.fillText(Number(gy.toFixed(3)), toPixelX(0) + 6, py - 4);
        }
      }
    }

    function draw2D() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      plot2DGraph();
    }

    function resetView() {
      if (viewMode === '3d') {
        Object.assign(view, default3DView);
      } else {
        Object.assign(view, default2DView);
      }
      draw();
    }

    function zoomView(factor) {
      if (viewMode === '3d') {
        view.zoom *= factor;
        draw();
        return;
      }

      const cx = (view.xMin + view.xMax) / 2;
      const cy = (view.yMin + view.yMax) / 2;
      const xRange = (view.xMax - view.xMin) * factor;
      const yRange = (view.yMax - view.yMin) * factor;
      view.xMin = cx - xRange / 2;
      view.xMax = cx + xRange / 2;
      view.yMin = cy - yRange / 2;
      view.yMax = cy + yRange / 2;
      draw();
    }

    function rotatePoint(point, rotX, rotY) {
      const cx = Math.cos(rotY), sx = Math.sin(rotY);
      const cy = Math.cos(rotX), sy = Math.sin(rotX);

      const x1 = point.x * cx + point.z * sx;
      const z1 = -point.x * sx + point.z * cx;
      const y1 = point.y * cy - z1 * sy;
      const z2 = point.y * sy + z1 * cy;

      return { x: x1, y: y1, z: z2 };
    }

    function project3D(point) {
      const scale = 250 * view.zoom;
      const x = point.x * scale;
      const y = point.y * scale;
      const z = point.z * scale;

      const perspective = 1 / (1 + z / 900);
      const screenX = canvas.width / 2 + x * perspective;
      const screenY = canvas.height / 2 - y * perspective;
      return { x: screenX, y: screenY, perspective };
    }

    function draw3D() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const surfaceItems = items.filter(item => item.type === 'surface' && item.visible && item.value.trim());
      const gridStep = 0.8;
      const xMin = view.xMin, xMax = view.xMax;
      const yMin = view.yMin, yMax = view.yMax;
      const zMin = view.zMin, zMax = view.zMax;

      const axisColor = '#94a3b8';
      const gridColor = '#1e293b';

      function draw3DGrid() {
        for (let x = xMin; x <= xMax + 0.001; x += gridStep) {
          ctx.beginPath();
          ctx.strokeStyle = gridColor;
          ctx.lineWidth = 1;
          let first = true;
          for (let y = yMin; y <= yMax + 0.001; y += gridStep) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const sp = project3D(p);
            if (first) { ctx.moveTo(sp.x, sp.y); first = false; } else { ctx.lineTo(sp.x, sp.y); }
          }
          ctx.stroke();
        }

        for (let y = yMin; y <= yMax + 0.001; y += gridStep) {
          ctx.beginPath();
          ctx.strokeStyle = gridColor;
          ctx.lineWidth = 1;
          let first = true;
          for (let x = xMin; x <= xMax + 0.001; x += gridStep) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const sp = project3D(p);
            if (first) { ctx.moveTo(sp.x, sp.y); first = false; } else { ctx.lineTo(sp.x, sp.y); }
          }
          ctx.stroke();
        }
      }

      draw3DGrid();

      if (!surfaceItems.length) {
        const origin = project3D(rotatePoint({ x: 0, y: 0, z: 0 }, view.rotX, view.rotY));
        ctx.strokeStyle = axisColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(origin.x - 60, origin.y);
        ctx.lineTo(origin.x + 60, origin.y);
        ctx.moveTo(origin.x, origin.y - 60);
        ctx.lineTo(origin.x, origin.y + 60);
        ctx.stroke();
        return;
      }

      surfaceItems.forEach(surface => {
        try {
          const parser = Parser.parse(surface.value);
          const scopeBase = getScope();
          const points = [];

          for (let gx = xMin; gx <= xMax + 0.0001; gx += 0.7) {
            const row = [];
            for (let gy = yMin; gy <= yMax + 0.0001; gy += 0.7) {
              const localScope = { ...scopeBase, x: gx, y: gy };
              const zValue = parser.evaluate(localScope);
              if (typeof zValue === 'number' && Number.isFinite(zValue)) {
                const p = rotatePoint({ x: gx, y: gy, z: zValue }, view.rotX, view.rotY);
                row.push(project3D(p));
              } else {
                row.push(null);
              }
            }
            points.push(row);
          }

          ctx.strokeStyle = surface.color;
          ctx.lineWidth = 1.5;

          for (let i = 0; i < points.length - 1; i++) {
            for (let j = 0; j < points[i].length - 1; j++) {
              const a = points[i][j];
              const b = points[i][j + 1];
              const c = points[i + 1][j];
              const d = points[i + 1][j + 1];

              [ [a, b], [a, c], [b, d], [c, d] ].forEach(([p1, p2]) => {
                if (p1 && p2) {
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.stroke();
                }
              });
            }
          }
        } catch (error) {
          // Ignore invalid 3D expressions while typing
        }
      });

      const axis = [
        { x: 0, y: 0, z: 0 },
        { x: 1, y: 0, z: 0 },
        { x: 0, y: 1, z: 0 },
        { x: 0, y: 0, z: 1 }
      ].map((p) => project3D(rotatePoint(p, view.rotX, view.rotY)));

      ctx.strokeStyle = axisColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(axis[0].x, axis[0].y);
      ctx.lineTo(axis[1].x, axis[1].y);
      ctx.moveTo(axis[0].x, axis[0].y);
      ctx.lineTo(axis[2].x, axis[2].y);
      ctx.moveTo(axis[0].x, axis[0].y);
      ctx.lineTo(axis[3].x, axis[3].y);
      ctx.stroke();
    }

    function syncModeUI() {
      document.querySelectorAll('.mode-button').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === viewMode);
      });

      const is3D = viewMode === '3d';
      document.getElementById('surfaceControls').style.display = is3D ? 'flex' : 'none';
      document.getElementById('xRangeLabel').textContent = `[${view.xMin.toFixed(1)}, ${view.xMax.toFixed(1)}]`;
      document.getElementById('yRangeLabel').textContent = `[${view.yMin.toFixed(1)}, ${view.yMax.toFixed(1)}]`;
    }

    function setMode(mode) {
      viewMode = mode;
      if (viewMode === '3d') {
        Object.assign(view, { ...default3DView, xMin: -5, xMax: 5, yMin: -5, yMax: 5, zMin: -5, zMax: 5 });
      } else {
        Object.assign(view, default2DView);
      }
      syncModeUI();
      draw();
    }

    function draw() {
      const { width, height } = canvas.getBoundingClientRect();
      if (width && height) {
        canvas.width = width;
        canvas.height = height;
      }

      if (viewMode === '3d') {
        draw3D();
      } else {
        draw2D();
      }

      syncModeUI();
    }

    canvas.addEventListener('mousedown', (event) => {
      dragState.active = true;
      dragState.x = event.clientX;
      dragState.y = event.clientY;
      canvas.classList.add('dragging');
    });

    window.addEventListener('mousemove', (event) => {
      if (!dragState.active) return;

      const dx = event.clientX - dragState.x;
      const dy = event.clientY - dragState.y;
      dragState.x = event.clientX;
      dragState.y = event.clientY;

      if (viewMode === '3d') {
        view.rotY += dx * 0.01;
        view.rotX += dy * 0.01;
      } else {
        const xMove = (dx / canvas.width) * (view.xMax - view.xMin);
        const yMove = (dy / canvas.height) * (view.yMax - view.yMin);
        view.xMin -= xMove;
        view.xMax -= xMove;
        view.yMin += yMove;
        view.yMax += yMove;
      }

      draw();
    });

    window.addEventListener('mouseup', () => {
      dragState.active = false;
      canvas.classList.remove('dragging');
    });

    canvas.addEventListener('wheel', (event) => {
      event.preventDefault();
      const factor = event.deltaY > 0 ? 1.10 : 0.90;
      zoomView(factor);
    }, { passive: false });

    document.querySelectorAll('.mode-button').forEach(button => {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    });

    function resizeCanvas() {
      const parent = canvas.parentElement;
      if (!parent) return;
      canvas.width = parent.clientWidth;
      canvas.height = parent.clientHeight;
    }

    function init() {
      renderExpressionList();
      setMode('2d');
      resizeCanvas();
      draw();
      window.addEventListener('resize', () => {
        resizeCanvas();
        draw();
      });
    }

    init();
  </script>
</body>
</html>
