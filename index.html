<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desmos 3D Graphing Calculator — Dark Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/expr-eval@2.0.2/dist/bundle.min.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --bg-2: #101720;
        --panel: #121a22;
        --panel-2: #171e29;
        --panel-3: #1d2732;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.12);
        --soft: rgba(255,255,255,0.035);
        --text: #edf4ff;
        --muted: #9ea8b5;
        --muted-2: #7a8797;
        --accent: #5ea5ff;
        --accent-2: #64d2c5;
        --shadow: rgba(0, 0, 0, 0.36);
        --button: #1a2330;
        --button-hover: #212d3b;
        --green: #59d7a4;
        --red: #ff7d7d;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        display: flex;
        min-height: 100vh;
        overflow: hidden;
      }

      button, input {
        font: inherit;
      }

      .app {
        display: flex;
        width: 100%;
        min-height: 100vh;
        background: linear-gradient(180deg, #0d1117 0%, #0c1219 100%);
      }

      .sidebar {
        width: 320px;
        min-width: 280px;
        background: linear-gradient(180deg, rgba(18,23,30,1), rgba(14,19,25,1));
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 11px;
        border-bottom: 1px solid var(--line);
        background: rgba(16,19,25,0.82);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        letter-spacing: 0.02em;
        font-weight: 700;
        color: var(--text);
      }

      .brand-badge {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(94,165,255,0.18), rgba(99,214,197,0.12));
        border: 1px solid rgba(255,255,255,0.06);
        color: #7cc4ff;
        font-size: 12px;
      }

      .reset-btn {
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 8px;
        padding: 7px 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
      }

      .reset-btn:hover {
        background: rgba(255,255,255,0.04);
      }

      .expr-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .expr-item {
        background: rgba(255,255,255,0.015);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 10px 10px 8px;
      }

      .expr-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .visibility-toggle {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.03);
        color: white;
        font-size: 11px;
        display: grid;
        place-items: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .visibility-toggle.on {
        background: rgba(89,215,164,0.9);
        border-color: rgba(89,215,164,1);
        color: #0b1117;
      }

      .expr-label {
        color: var(--muted-2);
        font-size: 12px;
        letter-spacing: 0.04em;
        font-weight: 700;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .expr-input {
        flex: 1;
        height: 32px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(11,15,20,0.85);
        color: var(--text);
        padding: 0 10px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        outline: none;
      }

      .expr-input:focus {
        border-color: rgba(94,165,255,0.8);
        box-shadow: inset 0 0 0 1px rgba(94,165,255,0.25);
      }

      .delete-btn {
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--muted-2);
        font-size: 17px;
        cursor: pointer;
        line-height: 1;
      }

      .delete-btn:hover {
        color: var(--red);
      }

      .sidebar-actions {
        padding: 12px 12px 16px;
        border-top: 1px solid var(--line);
        background: rgba(15,20,26,0.82);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .primary-btn, .secondary-btn {
        border: none;
        border-radius: 10px;
        padding: 11px 12px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.08s ease, filter 0.08s ease;
      }

      .primary-btn:hover, .secondary-btn:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .primary-btn {
        background: linear-gradient(135deg, #5ea5ff, #64d2c5);
        color: #081521;
      }

      .secondary-btn {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #0b1016;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
        padding: 10px 18px 8px;
        border-bottom: 1px solid var(--line);
        background: rgba(17,22,29,0.8);
      }

      .mode-switch {
        display: flex;
        align-items: center;
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        padding: 3px;
      }

      .mode-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        border-radius: 9px;
        padding: 8px 12px;
        font-weight: 800;
        cursor: pointer;
      }

      .mode-btn.active {
        background: rgba(94,165,255,0.12);
        color: #dfeeff;
        box-shadow: inset 0 0 0 1px rgba(94,165,255,0.3);
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-size: 20px;
        cursor: pointer;
      }

      .canvas-shell {
        position: relative;
        flex: 1;
        min-height: 0;
        background: linear-gradient(180deg, rgba(9,14,18,1), rgba(12,16,22,1));
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0d1117;
        cursor: grab;
      }

      canvas.dragging {
        cursor: grabbing;
      }

      @media (max-width: 900px) {
        body {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          min-width: 0;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .toolbar {
          flex-wrap: wrap;
          height: auto;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-badge">3D</div>
            <span>Graphing</span>
          </div>
          <button class="reset-btn" onclick="resetView()">Reset</button>
        </div>

        <div id="expressionList" class="expr-list"></div>

        <div class="sidebar-actions">
          <button class="primary-btn" onclick="addEquation()">＋ Add expression</button>
          <button class="secondary-btn" onclick="addPreset()">✦ Example</button>
        </div>
      </aside>

      <main class="main">
        <div class="toolbar">
          <div class="mode-switch">
            <button class="mode-btn active" type="button">3D</button>
          </div>

          <div class="toolbar-actions">
            <button class="icon-btn" type="button" onclick="zoomView(1.18)">＋</button>
            <button class="icon-btn" type="button" onclick="zoomView(0.85)">−</button>
          </div>
        </div>

        <div class="canvas-shell">
          <canvas id="graphCanvas"></canvas>
        </div>
      </main>
    </div>

    <script>
      const Parser = exprEval.Parser;
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');
      const palette = ['#5ea5ff', '#59d7a4', '#ffb454', '#f771b3', '#9f8cff', '#ff7f7f'];

      const defaultView = {
        xMin: -5,
        xMax: 5,
        yMin: -5,
        yMax: 5,
        zMin: -5,
        zMax: 5,
        rotX: -0.8,
        rotY: 0.9,
        zoom: 1
      };

      let view = { ...defaultView };
      let dragState = { active: false, x: 0, y: 0 };
      let items = [
        { id: createId('expr'), type: 'surface', value: 'sin(x) * cos(y)', visible: true, color: '#5ea5ff' }
      ];

      function createId(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function nextColor() {
        const used = items.filter(i => i.type === 'surface').length;
        return palette[used % palette.length];
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderList() {
        const container = document.getElementById('expressionList');
        container.innerHTML = '';

        items.forEach((item) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'expr-item';
          wrapper.innerHTML = `
            <div class="expr-row">
              <button class="visibility-toggle ${item.visible ? 'on' : ''}" onclick="toggleItem('${item.id}')">${item.visible ? '✓' : ''}</button>
              <span class="expr-label">z =</span>
              <input class="expr-input" style="border-color: ${item.color};" value="${escapeHtml(item.value)}" oninput="updateExpression('${item.id}', this.value)" />
              <button class="delete-btn" onclick="deleteItem('${item.id}')">×</button>
            </div>
          `;
          container.appendChild(wrapper);
        });
      }

      function addEquation() {
        items.push({ id: createId('expr'), type: 'surface', value: 'sin(x) * cos(y)', visible: true, color: nextColor() });
        renderList();
        draw();
      }

      function addPreset() {
        items = [
          { id: createId('expr'), type: 'surface', value: 'sin(x) * cos(y)', visible: true, color: '#5ea5ff' },
          { id: createId('expr'), type: 'surface', value: 'sqrt(9 - x^2 - y^2)', visible: true, color: '#59d7a4' }
        ];
        renderList();
        draw();
      }

      function updateExpression(id, value) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.value = value;
        draw();
      }

      function toggleItem(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        item.visible = !item.visible;
        renderList();
        draw();
      }

      function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        if (!items.length) {
          items.push({ id: createId('expr'), type: 'surface', value: 'sin(x) * cos(y)', visible: true, color: nextColor() });
        }
        renderList();
        draw();
      }

      function resetView() {
        Object.assign(view, { ...defaultView });
        draw();
      }

      function rotatePoint(point, rx, ry) {
        const cx = Math.cos(ry), sx = Math.sin(ry);
        const cy = Math.cos(rx), sy = Math.sin(rx);

        const x1 = point.x * cx + point.z * sx;
        const z1 = -point.x * sx + point.z * cx;
        const y1 = point.y * cy - z1 * sy;
        const z2 = point.y * sy + z1 * cy;

        return { x: x1, y: y1, z: z2 };
      }

      function project3D(point) {
        const scale = 180 * view.zoom;
        const x = point.x * scale;
        const y = point.y * scale;
        const z = point.z * scale;
        const perspective = 1 / (1 + z / 900);
        const px = canvas.width / 2 + x * perspective;
        const py = canvas.height / 2 - y * perspective;
        return { x: px, y: py, z };
      }

      function toWorldX(nx) {
        const range = view.xMax - view.xMin;
        return view.xMin + nx * range;
      }

      function toWorldY(ny) {
        const range = view.yMax - view.yMin;
        return view.yMin + ny * range;
      }

      function drawGrid() {
        const xMin = view.xMin, xMax = view.xMax;
        const yMin = view.yMin, yMax = view.yMax;

        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;

        const xStep = 1;
        const yStep = 1;

        for (let x = xMin; x <= xMax + 0.0001; x += xStep) {
          ctx.beginPath();
          let first = true;
          for (let y = yMin; y <= yMax + 0.0001; y += yStep) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const q = project3D(p);
            if (first) { ctx.moveTo(q.x, q.y); first = false; } else { ctx.lineTo(q.x, q.y); }
          }
          ctx.stroke();
        }

        for (let y = yMin; y <= yMax + 0.0001; y += yStep) {
          ctx.beginPath();
          let first = true;
          for (let x = xMin; x <= xMax + 0.0001; x += xStep) {
            const p = rotatePoint({ x, y, z: 0 }, view.rotX, view.rotY);
            const q = project3D(p);
            if (first) { ctx.moveTo(q.x, q.y); first = false; } else { ctx.lineTo(q.x, q.y); }
          }
          ctx.stroke();
        }
      }

      function drawAxes() {
        const axisEndpoints = [
          { x: 0, y: 0, z: 0 },
          { x: 1, y: 0, z: 0 },
          { x: 0, y: 1, z: 0 },
          { x: 0, y: 0, z: 1 }
        ].map(p => project3D(rotatePoint(p, view.rotX, view.rotY)));

        ctx.strokeStyle = '#c9d6ee';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(axisEndpoints[0].x, axisEndpoints[0].y);
        ctx.lineTo(axisEndpoints[1].x, axisEndpoints[1].y);
        ctx.moveTo(axisEndpoints[0].x, axisEndpoints[0].y);
        ctx.lineTo(axisEndpoints[2].x, axisEndpoints[2].y);
        ctx.moveTo(axisEndpoints[0].x, axisEndpoints[0].y);
        ctx.lineTo(axisEndpoints[3].x, axisEndpoints[3].y);
        ctx.stroke();
      }

      function drawSurface(item) {
        try {
          const parser = Parser.parse(item.value);
          const xMin = view.xMin, xMax = view.xMax;
          const yMin = view.yMin, yMax = view.yMax;
          const step = 0.7;
          const mesh = [];

          for (let gx = xMin; gx <= xMax + 0.0001; gx += step) {
            const row = [];
            for (let gy = yMin; gy <= yMax + 0.0001; gy += step) {
              const scope = { x: gx, y: gy };
              const zVal = parser.evaluate(scope);
              if (typeof zVal === 'number' && Number.isFinite(zVal)) {
                const p = rotatePoint({ x: gx, y: gy, z: zVal }, view.rotX, view.rotY);
                row.push(project3D(p));
              } else {
                row.push(null);
              }
            }
            mesh.push(row);
          }

          ctx.strokeStyle = item.color;
          ctx.lineWidth = 1.2;

          for (let i = 0; i < mesh.length - 1; i++) {
            for (let j = 0; j < mesh[i].length - 1; j++) {
              const a = mesh[i][j];
              const b = mesh[i][j + 1];
              const c = mesh[i + 1][j];
              const d = mesh[i + 1][j + 1];
              const segments = [[a, b], [a, c], [b, d], [c, d]];
              segments.forEach(([p1, p2]) => {
                if (p1 && p2) {
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.stroke();
                }
              });
            }
          }
        } catch (err) {
          // Ignore invalid input while editing.
        }
      }

      function draw() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width && rect.height) {
          canvas.width = rect.width;
          canvas.height = rect.height;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawAxes();

        items.filter(i => i.visible && i.value.trim()).forEach(drawSurface);
      }

      function zoomView(factor) {
        view.zoom *= factor;
        draw();
      }

      canvas.addEventListener('mousedown', (e) => {
        dragState.active = true;
        dragState.x = e.clientX;
        dragState.y = e.clientY;
        canvas.classList.add('dragging');
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragState.active) return;

        const dx = e.clientX - dragState.x;
        const dy = e.clientY - dragState.y;
        dragState.x = e.clientX;
        dragState.y = e.clientY;

        view.rotY += dx * 0.01;
        view.rotX += dy * 0.01;
        draw();
      });

      window.addEventListener('mouseup', () => {
        dragState.active = false;
        canvas.classList.remove('dragging');
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 1.08 : 0.93;
        zoomView(factor);
      }, { passive: false });

      function init() {
        renderList();
        resetView();
        draw();
        window.addEventListener('resize', draw);
      }

      init();
    </script>
  </body>
</html>
